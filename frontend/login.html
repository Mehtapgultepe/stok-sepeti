<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StokSepeti - Giriş</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-container { max-width: 400px; margin: 80px auto; padding: 0 20px; }
    .auth-box { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .auth-box h2 { color: #2d6a4f; margin-bottom: 24px; text-align: center; }
    .auth-box input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; box-sizing: border-box; }
    .auth-box input:focus { outline: none; border-color: #2d6a4f; }
    .auth-box button { width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .auth-box button:hover { background: #1b4332; }
    .auth-link { text-align: center; margin-top: 16px; font-size: 0.9rem; color: #666; }
    .auth-link a { color: #2d6a4f; font-weight: 600; }
    .error { color: #e63946; text-align: center; margin-top: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 StokSepeti</h1>
    <p>Mutfak Stok & Son Tüketim Tarihi Takibi</p>
  </header>
  <div class="auth-container">
    <div class="auth-box">
      <h2>Giriş Yap</h2>
      <input type="text" id="username" placeholder="Kullanıcı Adı" />
      <input type="password" id="password" placeholder="Şifre" />
      <button onclick="login()">Giriş Yap</button>
      <div class="error" id="error"></div>
      <div class="auth-link">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></div>
    </div>
  </div>
  <script>
    if (localStorage.getItem('token')) window.location.href = 'index.html';

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { document.getElementById('error').textContent = 'Tüm alanları doldurun'; return; }
      const res = await fetch('http://localhost:3001/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('error').textContent = data.error; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
